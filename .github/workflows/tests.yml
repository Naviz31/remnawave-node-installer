name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q remnawave_node
      - run: python -m ruff check --select F remnawave_node tests
      - run: bash -n install.sh
      - run: python -m unittest discover -s tests -p 'test_linux_smoke.py' -v
