[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remnawave-node-installer"
version = "1.0.4"
description = "Safe, idempotent installer and lifecycle CLI for a Remnawave Node"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Naviz31" }]
dependencies = []

[project.scripts]
remnawave-node = "remnawave_node.cli:main"

[tool.setuptools.packages.find]
include = ["remnawave_node*"]
